<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lester Adalia - photography, design, and technology portfolio.">
  <title>Lester Adalia | Portfolio</title>
  <link rel="shortcut icon" href="./assets/images/Untitled-2.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #101215;
      --paper: #e8e5df;
      --muted: #686862;
      --accent: #b63b2d;
      --line: rgba(16, 18, 21, 0.16);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.88), transparent 30%),
        radial-gradient(circle at 84% 78%, rgba(182, 59, 45, 0.12), transparent 28%),
        var(--paper);
      font-family: "DM Sans", sans-serif;
    }

    .home {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(100%, 1440px);
      height: 100vh;
      overflow: hidden;
      margin: auto;
      padding: clamp(24px, 4vw, 58px) clamp(20px, 5vw, 76px) clamp(20px, 3vw, 42px);
    }

    .intro {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
    }

    .eyebrow,
    .instruction,
    .footer {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .name {
      margin: 8px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(1.65rem, 3vw, 2.6rem);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1;
    }

    .instruction {
      align-self: center;
      max-width: 220px;
      line-height: 1.6;
      text-align: right;
    }

    .camera-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.5vh, 18px);
      min-height: 0;
      overflow: hidden;
      padding: clamp(24px, 4vh, 56px) 0;
    }

    .camera-wrap {
      position: relative;
      justify-self: center;
      width: min(100vw, 78vh, 1100px);
      margin-inline: auto;
      line-height: 0;
      filter: drop-shadow(0 28px 24px rgba(16, 18, 21, 0.18));
      animation: camera-arrive 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .camera-screen {
      position: absolute;
      top: 45.3%;
      left: 15.5%;
      width: 46%;
      height: 35.5%;
      overflow: hidden;
      border-radius: 2%;
      background: #050505;
      z-index: 1;
    }

    .camera-screen img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .camera {
      display: block;
      width: 100%;
      height: auto;
    }

    .ok-hotspot {
      position: absolute;
      top: 60.4%;
      left: 77.25%;
      width: 8.2%;
      aspect-ratio: 1;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transform: translate(-50%, -50%);
      z-index: 2;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .ok-hotspot::after {
      content: "";
      position: absolute;
      inset: -35%;
      border: 1px solid rgba(182, 59, 45, 0.6);
      border-radius: inherit;
      animation: ok-pulse 2.2s ease-out infinite;
    }

    .ok-hotspot:hover,
    .ok-hotspot:focus-visible {
      border-color: rgba(255, 255, 255, 0.85);
      background: rgba(182, 59, 45, 0.2);
      box-shadow: 0 0 0 5px rgba(182, 59, 45, 0.2), 0 0 22px rgba(182, 59, 45, 0.55);
      outline: none;
    }

    .ok-hotspot:focus-visible::after,
    .ok-hotspot:hover::after {
      animation-play-state: paused;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .footer-mark {
      color: var(--accent);
      font-size: 1.2rem;
      letter-spacing: 0;
    }

    .video-modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.88);
      z-index: 10;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .video-modal.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .video-modal video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }

    @keyframes camera-arrive {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ok-pulse {
      0% {
        opacity: 0.8;
        transform: scale(0.7);
      }
      75%,
      100% {
        opacity: 0;
        transform: scale(1.25);
      }
    }

    @media (max-width: 600px) {
      .intro {
        display: block;
      }

      .instruction {
        margin-top: 16px;
        text-align: left;
      }

      .camera-stage {
        min-height: 52vh;
      }

      .camera-wrap {
        width: min(116vw, 70vh);
        max-width: none;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .camera-wrap,
      .ok-hotspot::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="home">
    <header class="intro">
      <div>
        <p class="eyebrow">Personal portfolio</p>
        <h1 class="name">Lester Adalia</h1>
      </div>
      <p class="instruction">Press the camera's OK button to enter</p>
    </header>

    <section class="camera-stage" aria-label="Enter portfolio">
      <div class="camera-wrap">
        <div class="camera-screen">
          <img src="./assets/images/dp.jpeg" alt="Lester creating a photograph">
        </div>
        <img class="camera" src="./assets/images/canon.png" alt="Canon camera with an OK button on its control dial">
        <button class="ok-hotspot" type="button" aria-label="Play introduction and enter Lester Adalia's portfolio"></button>
      </div>
    </section>

    <footer class="footer">
      <span>Photography / Videography / Graphic Design</span>
      <span class="footer-mark">Unfiltered Shots</span>
    </footer>
  </main>

  <div class="video-modal" aria-hidden="true">
    <video class="video-modal__video" src="./assets/images/PNG.mp4" playsinline preload="auto"></video>
  </div>

  <script>
    const videoModal = document.querySelector(".video-modal");
    const video = document.querySelector(".video-modal__video");
    const okButton = document.querySelector(".ok-hotspot");

    const enterPortfolio = () => {
      window.location.href = "./portfolio.html";
    };

    okButton.addEventListener("click", () => {
      videoModal.classList.add("active");
      videoModal.setAttribute("aria-hidden", "false");
      video.currentTime = 0;
      video.play().catch(() => {
        video.controls = true;
      });
    });

    video.addEventListener("ended", enterPortfolio);

    videoModal.addEventListener("click", (event) => {
      if (event.target === videoModal) enterPortfolio();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && videoModal.classList.contains("active")) {
        enterPortfolio();
      }
    });
  </script>
</body>
</html>
